[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mvs"
version = "0.1.0"
description = "Markov Voice Stream: an endless, clearly labelled Markov chain remix of real speech clips (audio only)"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pyyaml>=6",
]

[project.optional-dependencies]
# Stages 2-3 (transcription, forced alignment, diarization). Heavy: pulls in torch.
align = ["whisperx>=3.1", "pyannote.audio>=3.1"]
# Disclaimer voice. Piper is the default; espeak-ng (system package) also works.
tts = ["piper-tts>=1.2"]
dev = ["pytest>=8"]

[project.scripts]
mvs = "mvs.cli:main"

[tool.setuptools]
packages = ["mvs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
